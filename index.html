<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Chat</title>
<style>
  :root {
    --page: #eef0f4;
    --surface: #ffffff;
    --line: #e6e8ec;
    --text: #14171c;
    --muted: #6b7280;
    --them: #f0f1f4;
    --them-text: #14171c;
    --me: #2f6bff;
    --me-text: #ffffff;
    --online: #22c55e;
    --shadow: 0 20px 60px rgba(20, 23, 28, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0c0d10;
      --surface: #16181d;
      --line: #262a31;
      --text: #f1f3f6;
      --muted: #8b93a1;
      --them: #262a31;
      --them-text: #f1f3f6;
      --me: #3b76ff;
      --shadow: 0 20px 60px rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page);
    color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 760px;
    height: 100dvh;
    background: var(--surface);
    display: flex;
    flex-direction: column;
  }
  @media (min-width: 800px) {
    body { padding: 28px 0; }
    .app { height: calc(100dvh - 56px); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
  }
  .avatar {
    flex: none;
    width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center;
    color: #fff; font-weight: 600; font-size: 15px;
    position: relative;
  }
  .avatar.small { width: 28px; height: 28px; font-size: 11px; }
  header .avatar::after {
    content: ""; position: absolute; right: -1px; bottom: -1px;
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--online); border: 2px solid var(--surface);
  }
  .title { font-weight: 600; font-size: 16px; }
  .subtitle { color: var(--muted); font-size: 13px; }

  .messages {
    flex: 1; overflow-y: auto;
    padding: 20px 18px 8px;
    display: flex; flex-direction: column;
  }
  .row { display: flex; align-items: flex-end; gap: 8px; margin-top: 2px; }
  .row.first { margin-top: 14px; }
  .row.me { justify-content: flex-end; }
  .row .avatar { visibility: hidden; }
  .row.last .avatar { visibility: visible; }
  .stack { display: flex; flex-direction: column; align-items: flex-start; max-width: min(75%, 520px); }
  .row.me .stack { align-items: flex-end; }
  .name { font-size: 12px; color: var(--muted); margin: 0 12px 3px; }
  .bubble {
    padding: 9px 14px;
    border-radius: 20px;
    background: var(--them); color: var(--them-text);
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .row.me .bubble { background: var(--me); color: var(--me-text); }
  /* tighten the corners inside a run of messages from the same person */
  .row.them:not(.first) .bubble { border-top-left-radius: 6px; }
  .row.them:not(.last) .bubble { border-bottom-left-radius: 6px; }
  .row.me:not(.first) .bubble { border-top-right-radius: 6px; }
  .row.me:not(.last) .bubble { border-bottom-right-radius: 6px; }
  .row.new .bubble { animation: pop .18s ease-out; }
  @keyframes pop { from { transform: translateY(6px) scale(.97); opacity: 0; } }
  .dots { display: flex; gap: 4px; padding: 14px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }
  .notice { margin: auto; color: var(--muted); text-align: center; padding: 24px; }

  form {
    display: flex; align-items: flex-end; gap: 10px;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
  }
  textarea {
    flex: 1; resize: none;
    font: inherit; color: var(--text);
    background: var(--them);
    border: 1px solid transparent; border-radius: 22px;
    padding: 10px 16px;
    max-height: 140px; outline: none;
  }
  textarea:focus { border-color: var(--me); }
  textarea::placeholder { color: var(--muted); }
  button {
    flex: none; width: 42px; height: 42px; border-radius: 50%;
    border: 0; background: var(--me); color: #fff; cursor: pointer;
    display: grid; place-items: center;
    transition: opacity .15s, transform .1s;
  }
  button:disabled { opacity: .35; cursor: default; }
  button:not(:disabled):active { transform: scale(.94); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar" id="headAvatar"></div>
    <div>
      <div class="title" id="title">&nbsp;</div>
      <div class="subtitle" id="subtitle"></div>
    </div>
  </header>
  <div class="messages" id="messages"></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Message" autofocus></textarea>
    <button id="send" type="submit" aria-label="Send" disabled>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>
</div>

<script>
// The conversation lives in chat.txt next to this page.
// Add ?chat=name to the URL to load name.txt instead.
const param = new URLSearchParams(location.search).get('chat') || 'chat';
const file = param.replace(/[^\w-]/g, '') + '.txt';

const $ = id => document.getElementById(id);
const SETTINGS = ['me', 'title', 'subtitle'];
const COLORS = ['#f97316', '#8b5cf6', '#0ea5e9', '#ec4899', '#14b8a6', '#eab308', '#ef4444', '#6366f1'];

let settings = {};
let messages = [];   // { name, text, isNew }
let replies = [];    // scripted replies, played one per message sent
let typing = [];     // names currently "typing"
const REPLY_DELAY = 1000;

function parse(text) {
  const out = { settings: {}, messages: [], replies: [] };
  let target = out.messages;
  for (const raw of text.replace(/\r/g, '').split('\n')) {
    if (raw.trimStart().startsWith('#')) continue;
    // A line starting with --- ends the history; what follows are scripted replies.
    if (raw.startsWith('---')) { target = out.replies; continue; }
    // "Name: text" at the very start of a line begins a new message.
    const m = raw.match(/^([^\s:][^:]{0,39}):(?:\s+(.*)|\s*)$/);
    if (m) {
      const key = m[1].trim(), value = (m[2] || '').trim();
      if (target === out.messages && !target.length && SETTINGS.includes(key.toLowerCase())) {
        out.settings[key.toLowerCase()] = value;
      } else {
        target.push({ name: key, text: value });
      }
    } else if (target.length && raw.trim()) {
      const last = target[target.length - 1];
      last.text += (last.text ? '\n' : '') + raw.trim();
    }
  }
  return out;
}

const initials = name => name.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const colorFor = name => COLORS[[...name].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const same = (a, b) => a.trim().toLowerCase() === b.trim().toLowerCase();

function avatar(name, small) {
  const el = document.createElement('div');
  el.className = 'avatar' + (small ? ' small' : '');
  el.textContent = initials(name);
  el.style.background = colorFor(name);
  return el;
}

function render() {
  const me = settings.me || '';
  const others = [...new Set(messages.map(m => m.name).filter(n => !same(n, me)))];
  const title = settings.title || others.join(', ') || 'Chat';
  $('title').textContent = title;
  $('subtitle').textContent = settings.subtitle ?? 'Active now';
  document.title = title;
  $('headAvatar').textContent = initials(title);
  $('headAvatar').style.background = colorFor(others.length === 1 ? others[0] : title);
  const group = others.length > 1;

  const box = $('messages');
  box.textContent = '';
  messages.forEach((msg, i) => {
    const mine = same(msg.name, me);
    const first = i === 0 || messages[i - 1].name !== msg.name;
    const last = i === messages.length - 1 || messages[i + 1].name !== msg.name;
    const row = document.createElement('div');
    row.className = `row ${mine ? 'me' : 'them'}${first ? ' first' : ''}${last ? ' last' : ''}${msg.isNew ? ' new' : ''}`;
    msg.isNew = false;
    if (!mine) row.append(avatar(msg.name, true));
    const stack = document.createElement('div');
    stack.className = 'stack';
    if (group && !mine && first) {
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = msg.name;
      stack.append(name);
    }
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = msg.text;
    stack.append(bubble);
    row.append(stack);
    box.append(row);
  });
  if (typing.length) {
    const row = document.createElement('div');
    row.className = 'row them first last';
    const bubble = document.createElement('div');
    bubble.className = 'bubble dots';
    bubble.innerHTML = '<i></i><i></i><i></i>';
    row.append(avatar(typing[0], true), bubble);
    box.append(row);
  }
  box.scrollTop = box.scrollHeight;
}

function notice(text) {
  const el = document.createElement('div');
  el.className = 'notice';
  el.textContent = text;
  $('messages').replaceChildren(el);
}

// Composer: Enter sends, Shift+Enter adds a line. Sent messages are not saved;
// a refresh returns to what chat.txt says.
const input = $('input'), sendBtn = $('send');
function resize() {
  input.style.height = 'auto';
  input.style.height = input.scrollHeight + 2 + 'px';
  sendBtn.disabled = !input.value.trim();
}
input.addEventListener('input', resize);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('form').requestSubmit(); }
});
$('form').addEventListener('submit', e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  messages.push({ name: settings.me || 'Me', text, isNew: true });
  input.value = '';
  resize();
  const reply = replies.shift();
  if (reply) {
    typing.push(reply.name);
    setTimeout(() => {
      typing.shift();
      messages.push({ ...reply, isNew: true });
      render();
    }, REPLY_DELAY);
  }
  render();
  input.focus();
});

fetch(file + '?t=' + Date.now(), { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(text => {
    const parsed = parse(text);
    settings = parsed.settings;
    messages = parsed.messages;
    replies = parsed.replies;
    if (!settings.me) settings.me = 'Me';
    render();
  })
  .catch(() => notice(`Could not load ${file}.`));
</script>
</body>
</html>
